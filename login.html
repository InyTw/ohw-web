<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="icon" href="images/server-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHW Store - 登入</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', "Microsoft JhengHei", sans-serif; 
            background-color: #f0f2f5; 
            color: #4a5568; 
            overflow: hidden; 
        }

        /* 延續主頁的影片背景 */
        .video-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            overflow: hidden;
        }
        .video-background video {
            min-width: 100%; min-height: 100%;
            width: auto; height: auto;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            filter: brightness(0.9); /* 登入頁稍微暗一點，凸顯卡片 */
        }
        
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(8px); /* 增加模糊度，增加儀式感 */
            z-index: -1;
        }

        /* 玻璃擬態卡片 */
        .login-card {
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        /* Discord 品牌色按鈕優化 */
        .btn-discord {
            background: #5865F2;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background: #4752c4;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(88, 101, 242, 0.4);
        }

        .text-soft-glow {
            color: #6366f1;
            text-shadow: 0 5px 15px rgba(99, 102, 241, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <!-- 背景影片區塊 -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="images/nijika-ijichi-bocchi-the-rock.3840x2160.mp4" type="video/webm">
        </video>
    </div>
    <div class="bg-overlay"></div>

    <!-- 登入卡片 -->
    <div class="login-card w-full max-w-md p-10 md:p-14 text-center">
        <!-- 伺服器 Logo (可選) -->
        <div class="mb-8 flex justify-center">
            <div class="w-20 h-20 bg-white/50 rounded-3xl p-4 shadow-inner backdrop-blur-sm border border-white/50">
                <img src="images/server-icon.png" alt="OHW Logo" class="w-full h-full object-contain">
            </div>
        </div>

        <h2 class="text-3xl font-bold mb-3 tracking-tighter text-gray-800">歡迎回來</h2>
        <p class="text-gray-500 font-light mb-10 tracking-wide text-sm">請使用 Discord 帳號登入 OHW Store</p>
        
        <div class="space-y-4">
            <a id="login-link" href="#" class="btn-discord flex items-center justify-center gap-3 w-full py-4 text-white font-bold rounded-2xl">
                <!-- Discord SVG Icon -->
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M20.317 4.37a19.791 19.791 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037 19.736 19.736 0 00-4.885 1.515.069.069 0 00-.032.027C.533 9.048-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028 14.09 14.09 0 001.226-1.994.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.292.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.299 12.299 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                使用 Discord 登入
            </a>
            
            <a href="index.html" class="block text-xs text-gray-400 hover:text-indigo-500 transition pt-4 underline underline-offset-4 decoration-gray-300">
                返回主頁面
            </a>
        </div>
    </div>

    <!-- 頁尾版權 -->
    <div class="fixed bottom-8 text-gray-400 text-[10px] tracking-[0.3em] uppercase">
        © 2026 OHW Network Group
    </div>

    <script src="script/login.js"></script>
</body>
</html>
