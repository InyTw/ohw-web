<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站維護模式 | ohw Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 定義柔和莫蘭迪色調 */
            --bg-soft: #f7f9fc; /* 米白/淡藍灰，與主頁一致 */
            --text-main: #ffffff; /* 柔和深灰 */
            --text-sub: #000000; /* 淡灰 */
            --primary-pastel: #a29bfe; /* 柔和紫 */
            --card-bg: #ffffff;

        }

        :root.color {
            --red: #ff0000;
            --orange: #ff9f43;
            --yellow: #feca57;
            --green: #1dd1a1;
            --blue: #54a0ff;
            --indigo: #5f27cd;
            --purple: #a29bfe;
        }

        body {
            font-family: 'Inter', "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* 延用主頁的柔和 GIF 背景 */
        .bg-video {
            position: fixed;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1; /* 保持在頁面最底層 */
            object-fit: cover; /* 確保影片填滿螢幕不留白 */
        }

        /* 超級大圓角柔和卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.041);
            backdrop-filter: blur(10px); /* 玻璃模糊 */
            border: 1px solid rgb(255, 255, 255);
            border-radius: 40px; /* 超大圓角 */
            box-shadow: 0 20px 50px rgba(162, 155, 254, 0.1); /* 淡淡的紫色陰影 */
        }

        /* 柔和漸層按鈕 */
        .btn-pastel {
            background: linear-gradient(135deg, #a29bfe 0%, #d630311a 100%);
            background-color: var(--primary-pastel);
            color: white;
            transition: 0.4s;
            box-shadow: 0 8px 20px rgba(162, 155, 254, 0.3);
        }

        .btn-pastel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(162, 155, 254, 0.4);
        }

        /* 頁尾文字 */
        .footer-text {
            color: var(--text-sub);
            font-size: 11px;
            letter-spacing: 0.4em;

        }

        /* 連結樣式 */
        .link {
            color: #fd4646;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .ann-link {
            color: #7700ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .val {
            color: #00aeff;
            text-decoration:solid;
            font-weight: 600;
            transition: 0.3s;
        }
    </style>
</head>
<body class="p-6">

    <video autoplay muted loop playsinline class="bg-video">
        <source src="/images/Gawr-Gura-and-Amelia-Watson-vibing-near-a-campfire-live-wallpaper.mp4" type="video/mp4">
    </video>

    <div class="relative z-10 text-center">
        
        <div class="glass-card p-12 lg:p-16 max-w-2xl mx-auto mt-4">
            <h2 class="text-2xl font-bold tracking-tight mb-4 text-[#2d3436]">
<h2 class="text-2xl font-bold tracking-tight mb-4 text-[#ff0000]">【維護模式】</h2><br>(<a class="link" href="https://dsc.gg/ohw-network" target="_blank">Discord 被低能炸了</a>)
            <p class="text-[var(--text-main)] text-sm leading-relaxed tracking-wider mb-10">
                我們的網站變得更優質了，還加入了論壇系統！<br>
                <p class="text-[#ffc400] font-bold">最新情報！！！</p><br>
                <a class="val" href="https://www.youtube.com/watch?v=mydz0zXDjfA" target="_blank">全球預約熱烈開跑！<br>【Official Music Video】証命讚歌（Shoumeisanka）/ MyGO!!!!!</a><a class="ann-link" href="https://youtu.be/lkS9XIzWObc?si=BiSfG3B0GlezU5Rt" target="_blank"></a>
                <br><br>
                <p class="font-bold">現在 <e class="text-[#00aeff] font-bold">BanG Dream！交織的樂章</e> 已正式展開預約！！！</p>
            </p>

        <div class="mt-16 footer-text">
            ohw Network · Maintenance System
        </div>
    </div>

</body>
</html>
