<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加入招募 | ohw Network</title>
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/css/apply.css">
    <script src="/scripts/apply.js"></script>
</head>
<body>
    <div class="form-wrap">
        <h1>招募申請</h1>
        <p class="subtitle">請填寫下方資訊，加入我們的開發團隊。</p>
        <form id="apply-form">
            <div class="input-row">
                <label for="mc-id">Minecraft ID</label>
                <input type="text" id="mc-id" name="mc-id" required placeholder="例如: Steve" autocomplete="username">
            </div>
            <div class="input-row">
                <label for="dc-id">Discord ID</label>
                <input type="text" id="dc-id" name="dc-id" required placeholder="例如: user#0000" autocomplete="nickname">
            </div>
            <div class="input-row">
                <label for="email">電子郵件 (Gmail)</label>
                <input type="email" id="email" name="email" required placeholder="example@gmail.com" autocomplete="email">
            </div>
            <div class="input-row">
                <label for="role">應徵職位</label>
                <select id="role" name="role" autocomplete="off">
                    <option value="環境設計">環境設計</option>
                    <option value="社群營運">社群營運</option>
                </select>
            </div>
            <div class="input-row">
                <label for="bio">簡述資歷 (50字以上)</label>
                <textarea id="bio" name="bio" rows="5" required placeholder="請簡單介紹你的實作經驗..." autocomplete="off"></textarea>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn">提交審查單</button>
        </form>
    </div>
</body>
</html>
