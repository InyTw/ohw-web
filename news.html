<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新消息 | SERVER NETWORK</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-main: #060814; --primary: #00f5d4; --text-light: #f8fafc; --text-muted: #64748b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, monospace; }
        body { background-color: var(--bg-main); color: var(--text-light); padding: 3rem 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .news-card { 
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 20px; overflow: hidden; margin-bottom: 2rem;
        }
        
        .news-cover { width: 100%; height: 250px; background-size: cover; background-position: center; background-color: #1a1d2e; }
        
        .news-body { padding: 2rem; }
        .category { color: var(--primary); font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
        .title { font-size: 1.8rem; margin: 0.5rem 0; color: #fff; }
        .content { color: #cbd5e1; line-height: 1.8; margin-top: 1rem; white-space: pre-wrap; }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container" id="news-container">
        <div style="text-align:center; margin-top:5rem; color:var(--primary)">正在讀取最新公告...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://zllomerkzdmmphfcceew.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpsbG9tZXJremRtbXBoZmNjZWV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxMzUxOTQsImV4cCI6MjA5NzcxMTE5NH0.x_0KZpvzJQBPLFccYCzz4I2aqNPBnB-t0ohjHhKSePk'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadNews() {
            const { data: news, error } = await supabase
                .from('news')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { console.error(error); return; }

            const container = document.getElementById('news-container');
            container.innerHTML = '';

            news.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                // 這裡處理圖片：如果 cover 有資料，就直接作為背景圖顯示
                // 因為 Base64 字串可以直接塞在 style 的 url() 裡
                const coverStyle = item.cover ? `background-image: url('${item.cover}');` : '';

                card.innerHTML = `
                    <div class="news-cover" style="${coverStyle}"></div>
                    <div class="news-body">
                        <div class="category">${item.category}</div>
                        <h2 class="title">${item.title}</h2>
                        <div class="content">${item.content}</div>
                        <div class="footer">發佈者: ${item.author} | ${new Date(item.created_at).toLocaleDateString()}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadNews();
    </script>
</body>
</html>
