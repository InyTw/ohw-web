<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <title>管理團隊 | ohw Network</title>
    <link rel="stylesheet" href="css/staff-list.css">
    <script src="scripts/staff-list.js" defer></script>
</head>
<body>
    <header>
        <div class="brand-logo">ohw Network</div>
        <nav>
            <a href="index.html">首頁入口</a>
            <a href="news.html">公告資訊</a>
            <a href="staff-list.html" class="active">管理團隊</a>
            <a href="apply.html">加入招募</a>
        </nav>
    </header>

    <div class="main-wrap">
        <h2 class="group-header">工作人員名單</h2>
        <div class="matrix-grid">
            
                <div class="user-panel" data-role="owner">
                    <div class="avatar-container">
                        <img src="https://mc-heads.net/avatar/InyTw" alt="InyTw" class="mc-avatar">
                    </div>
                    <h3 class="owner">InyTw</h3>
                    <span class="role-badge">創始人</span>
                    <div class="hover-card">
                        <div class="card-bg" style="background-image: url('/images/sakikomusic.gif');"></div>
                        <div class="hover-content">
                            <h4 class="owner">InyTw</h4>
                            <p class="role-description"></p>
                            <hr style="opacity: 0.2; margin: 10px 0;">
                            <p class="user-custom-bio">特戰新圖拉玩了</p>
                        </div>
                    </div>
                </div>

                <div class="user-panel" data-role="builder-leader">
                    <div class="avatar-container">
                        <img src="https://mc-heads.net/avatar/KaiChou0711" alt="KaiChou0711" class="mc-avatar">
                    </div>
                    <h3 class="builder">KaiChou0711</h3>
                    <span class="role-badge">建築總管理</span>
                    <div class="hover-card">
                        <div class="card-bg" style="background-image: url('/images/sakiko-err.gif');"></div>
                        <div class="hover-content">
                            <h4 class="builder">KaiChou0711</h4>
                            <p class="role-description"></p>
                            <hr style="opacity: 0.2; margin: 10px 0;">
                            <p class="user-custom-bio">狗狗</p>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</body>
</html>
