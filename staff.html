<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <title>工作人員面板 | Staff Dash</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="/scripts/staff.js" defer></script>
    <link rel="stylesheet" href="/css/staff.css">
</head>
<body>

    <div id="loading-overlay">載入驗證中...</div>

    <aside id="sidebar">
    <div class="nav-group">
        <div class="brand">
            <span id="toggle-btn" onclick="toggleSidebar()">☰</span>
            <span class="brand-text">STAFF<span>PANEL</span></span>
        </div>
        
        <div class="nav-item" onclick="switchTab('review-panel', this)">
            <span class="icon">📋</span><span class="nav-text">審核申請清單</span>
        </div>
        <div class="nav-item active" onclick="switchTab('news-panel', this)">
            <span class="icon">📰</span><span class="nav-text">發布新聞</span>
        </div>
            <div class="nav-item" onclick="switchTab('server-panel', this)">
                <span class="icon">🖥️</span><span class="nav-text">伺服器與機器人狀態</span>
            </div>
        </div>

        <div class="user-profile-card" id="user-profile-entry" style="cursor: pointer;">
            <div class="user-main-info" onclick="switchTab('profile-panel', this)">
                <div class="user-avatar" id="display-avatar">...</div>
                <div class="user-meta">
                    <div class="user-name" id="display-username">載入中...</div>
                    <div class="user-rank" id="display-rank">Rank: --</div>
                    <span class="verify-badge unverified" id="display-status">檢查中</span>
                </div>
            </div>
            <div class="user-action-line">
                <span class="user-account-email" id="display-email">loading...</span>
                <span class="inline-logout-btn" onclick="handleLogout('profile-panel', this)">登出 ➔</span>
            </div>
        </div>
    </aside>

    <main>
        <div id="review-panel" class="content-panel">
        <div class="page-header">
            <h1>招募申請審核</h1>
            <p>處理所有待審核的技術與營運入隊申請。</p>
        </div>
        <div id="review-list" style="display:grid; gap:1rem;">
            </div>
        </div>
        
        <div id="news-panel" class="content-panel active">
            <div class="page-header"><h1>上架新聞公告</h1><p>發佈最新消息至伺服器官網首頁與公告區。</p></div>
            <div class="card">
                <form id="news-form" onsubmit="publishNews(event)">
                    <div class="form-group">
                        <label>公告分類</label>
                        <select id="news-category">
                            <option value="SYSTEM">SYSTEM / 系統公告</option>
                            <option value="SYSTEM">EVENT / 活動公告</option>
                            <option value="SYSTEM">EMERGENCY / 緊急公告</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>新聞標題</label>
                        <input type="text" id="news-title" placeholder="請輸入標題..." required>
                    </div>
                    <div class="form-group">
                        <label>詳細公告內容</label>
                        <textarea id="news-content" rows="6" placeholder="請輸入詳細公告內容..." required></textarea>
                    </div>
                    <button type="submit" class="btn" id="btn-publish-news">發佈公告</button>
                </form>
            </div>
        </div>

        <div id="ban-panel" class="content-panel">
            <div class="search-bar">
                <input type="text" id="player-search" placeholder="輸入 ID 搜尋...">
                <button id="search-btn">搜尋</button>
            </div>
        
            <div id="player-grid" class="player-grid"></div>
        </div>

        <div id="profile-panel" class="content-panel">
    <div class="page-header">
        <h1>帳號與個人資料設定</h1>
        <p>管理員數據將儲存於 Supabase 資料庫中的 profiles 資料表</p>
    </div>
    <div class="grid-2">
        <div class="card">
            <h3>📝 變更管理員名稱與頭像</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.5rem 0 1.5rem 0;">
                點擊頭像即可上傳，拖曳滑鼠可移動位置，並用控制條縮放。
            </p>
            <form onsubmit="updateUserProfileDatabase(event)">
                <div class="form-group">
                    <label>全新使用者名稱</label>
                    <input type="text" id="input-new-username" placeholder="請輸入新暱稱..." required>
                </div>
                
                <div class="form-group">
                    <label>個人頭像</label>
                    <input type="file" id="input-file-avatar" accept="image/*" hidden onchange="previewSelectedAvatar(this)">
                    
                    <div class="avatar-preview-container">
                        <label for="input-file-avatar" class="avatar-preview" id="avatar-preview-box">
                            <div class="upload-overlay">變更頭像</div>
                        </label>
                    </div>
                </div>
                <button onsubmit="updateUserProfileDatabase(event)" type="submit" class="btn" id="btn-update-profile">儲存個人設定</button>
            </form>
        </div>
    </div>
</div>
        </div>
    </main>

    
<div id="avatar-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div class="modal-content" style="background:#2a2a40; padding:20px; border-radius:12px; width:90%; max-width:500px; color:white;">
        <h3>編輯頭像</h3>
        <div id="img-container" style="width:100%; height:300px; background:#000;">
            <img id="image-to-crop" src="" style="max-width:100%;">
        </div>
        <div style="margin-top:20px;">
            <button onclick="closeModal()">取消</button>
            <button onclick="saveCroppedImage()">套用</button>
        </div>
    </div>
</div>

</div>
</body>
</html>
