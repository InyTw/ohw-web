<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <title>登入帳號 | ohw Network</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

    <header>
        <div class="brand-logo">ohw Network</div>
        <nav>
            <a href="index.html">首頁</a>
            <a href="forum.html">論壇</a>
            <a href="news.html">公告</a>
            <a href="staff-list.html">管理團隊</a>
            <a href="apply.html">加入招募</a>
        </nav>
        <div class="user-auth" id="userAuthContainer"></div>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">登入 ohw Network</h2>
            <p class="login-subtitle">請選擇您的驗證管道以登入論壇與玩家社群</p>

            <div class="oauth-group">
                <!-- 1. Microsoft 登入 (Minecraft 正版驗證) -->
                <button class="btn-oauth btn-microsoft" onclick="loginWithMicrosoft()">
                    <svg width="20" height="20" viewBox="0 0 23 23">
                        <path fill="#f35325" d="M1 1h10v10H1z"/>
                        <path fill="#81bc06" d="M12 1h10v10H1z"/>
                        <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                        <path fill="#ffba08" d="M12 12h10v10H1z"/>
                    </svg>
                    使用 Microsoft 帳號登入 (Minecraft 正版)
                </button>

                <!-- 2. Discord 登入 -->
                <button class="btn-oauth btn-discord" onclick="loginWithDiscord()">
                    <svg width="20" height="20" viewBox="0 0 127.14 96.36" fill="currentColor">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-21.84-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,45.91,53.87,53,48.83,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,45.91,96.11,53,91.08,65.69,84.69,65.69Z"/>
                    </svg>
                    使用 Discord 帳號登入
                </button>
            </div>

            <div class="auth-info-box">
                <p>💡 <b>登入說明：</b></p>
                <ul>
                    <li><b>Microsoft 登入：</b>會自動連動您的 Minecraft 正版遊戲 ID 與 Skin 皮膚。</li>
                    <li><b>Discord 登入：</b>登入後可於個人設定中綁定 Minecraft 遊戲 ID。</li>
                </ul>
            </div>

            <a href="index.html" class="back-home-link">← 返回首頁</a>
        </div>
    </div>

    <footer><p>&copy; 2026 ohw Network. 保留所有權利。</p></footer>

    <script src="/js/auth.js"></script>
</body>
</html>
