<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHW Network | 驗證成功</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="./images/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(32, 34, 37, 0.85);
            --success-green: #3ba55c;
            --text-primary: #ffffff;
            --text-secondary: #b9bbbe;
        }

        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* 背景圖設定 */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('./images/sakikomusic.gif') no-repeat center center fixed;
            background-size: cover;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 64px;
            color: var(--success-green);
            margin-bottom: 20px;
        }

        .info-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid var(--success-green);
            text-align: left;
        }

        .info-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 18px;
            color: #fff;
            font-weight: 700;
        }

        .btn-close {
            display: inline-block;
            margin-top: 10px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            transition: background 0.3s;
            cursor: pointer;
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="success-icon">✓</div>
        <h1 class="text-white text-3xl font-bold mb-2">驗證成功！</h1>
        <p class="text-gray-300">您的 Minecraft 帳號已成功與 Discord 連結</p>

        <div class="info-box">
            <div>
                <span class="info-label">已綁定玩家</span><br>
                <span class="info-value">{{ mc_name }}</span>
            </div>
            <div class="mt-4">
                <span class="info-label">綁定時間</span><br>
                <span class="info-value">2026-04-25</span>
            </div>
        </div>

        <p class="text-gray-400 text-sm mb-6">現在您可以返回遊戲，<br>盡情享受 OHW Network 的冒險之旅。</p>
        
        <button onclick="window.close()" class="btn-close">關閉視窗</button>
    </div>

</body>
</html>
