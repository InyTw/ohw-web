<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統負載 | Saki Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #e5e7eb; }
        .progress-bg { background-color: rgba(255,255,255,0.05); height: 6px; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #818cf8, #6366f1); border-radius: 3px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        .data-loading { opacity: 0.5; filter: blur(1px); }
    </style>
</head>
<body class="p-8 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="mb-12">
            <a href="/saki_docs.html" class="text-indigo-400 text-sm hover:underline mb-4 inline-block">← 返回文件中心</a>
            <h1 class="text-4xl font-extrabold mb-2">系統負載</h1>
            <p class="text-gray-400">連線至 Saki Music 核心監控 API...</p>
        </header>

        <div id="stats-container" class="bg-[#161616] border border-white/10 rounded-2xl p-8 shadow-2xl transition-all duration-500">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-10">
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold tracking-widest mb-1">上線時間</p>
                    <p id="uptime" class="text-2xl font-mono text-white">---</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold tracking-widest mb-1">伺服器總數</p>
                    <p id="guilds" class="text-2xl font-mono text-white">---</p>
                </div>
                <div>
                    <p class="text-xs text-gray-500 uppercase font-bold tracking-widest mb-1">活躍播放中</p>
                    <p id="players" class="text-2xl font-mono text-white">---</p>
                </div>
            </div>

            <div class="space-y-6">
                <div>
                    <div class="flex justify-between mb-2 text-sm font-semibold">
                        <span>CPU 使用率</span>
                        <span id="cpu-text" class="text-indigo-400">Connecting...</span>
                    </div>
                    <div class="progress-bg">
                        <div id="cpu-bar" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between mb-2 text-sm font-semibold">
                        <span>記憶體 (RAM)</span>
                        <span id="ram-text" class="text-indigo-400">---</span>
                    </div>
                    <div class="progress-bg">
                        <div id="ram-bar" class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <p id="last-update" class="mt-6 text-[10px] text-gray-600 font-mono uppercase text-right">Last sync: Never</p>
    </div>

    <script>
async function refreshStats() {
    try {
        const statsContainer = document.getElementById('stats-container');
        // 加上時間戳防止快取
        const GITHUB_URL = "https://cdn.jsdelivr.net/gh/InyTw/SakiBot-Music@main/stats.json";
        const res = await fetch(`${GITHUB_URL}?t=${Date.now()}`);

        if (!res.ok) throw new Error("GitHub 回傳錯誤");

        const data = await res.json();

        // --- 根據你提供的 JSON 格式直接讀取 ---
        document.getElementById('uptime').innerText = data.uptime || "---";
        document.getElementById('guilds').innerText = data.guilds || "0";
        document.getElementById('players').innerText = data.players || "0";

        // 更新 CPU 進度條
        const cpuVal = data.cpu || 0;
        document.getElementById('cpu-text').innerText = `${cpuVal}%`;
        document.getElementById('cpu-bar').style.width = `${cpuVal}%`;

        // 更新 RAM 進度條
        // 根據你提供的 JSON: ram_used / ram_total
        const ramUsed = data.ram_used || 0;
        const ramTotal = data.ram_total || 2048;
        const ramPercent = Math.round((ramUsed / ramTotal) * 100);
        
        document.getElementById('ram-text').innerText = `${ramUsed}MB / ${ramTotal}MB`;
        document.getElementById('ram-bar').style.width = `${ramPercent}%`;

        // 更新同步時間
        const now = new Date();
        document.getElementById('last-update').innerText = `Last sync: ${now.toLocaleTimeString()}`;
        
        statsContainer.classList.remove('data-loading');
        console.log("✅ 數據同步成功");

    } catch (error) {
        console.error("❌ 連線失敗:", error);
        document.getElementById('cpu-text').innerText = "連線失敗";
        document.getElementById('stats-container').classList.add('data-loading');
    }
}

// 每 60 秒自動刷新
setInterval(refreshStats, 60000);
window.onload = refreshStats;
</script>
</body>
</html>
