<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>節點狀態 | Saki Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #e5e7eb; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .online { background-color: #10b981; box-shadow: 0 0 8px #10b981; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="p-8 md:p-12">
    <div class="max-w-4xl mx-auto">
        <header class="mb-12">
            <a href="/saki_docs.html" class="text-indigo-400 text-sm hover:underline mb-4 inline-block">← 返回文件中心</a>
            <h1 class="text-4xl font-extrabold mb-2">節點狀態</h1>
            <p class="text-gray-400">即時監控 Saki Music 全球節點運行狀況。</p>
            <div id="user-region" class="text-xs text-indigo-400/80 mt-4 font-mono pulse">
                正在偵測最佳連線路徑...
            </div>
        </header>

        <div class="grid gap-4">
            <div id="tc-node-container" class="bg-[#161616] border border-white/5 p-6 rounded-xl flex items-center justify-between shadow-lg transition-all duration-500">
                <div class="flex items-center gap-4">
                    <div class="status-dot online"></div>
                    <div>
                        <h3 class="font-bold flex items-center" id="tc-node">台中節點 (Taichung - 01)</h3>
                        <p class="text-xs text-gray-500">提供中部地區以及全台低延遲連線</p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="tc-latency" class="text-indigo-400 font-mono text-sm">-- ms</span>
                    <p class="text-[10px] text-gray-600 uppercase tracking-tighter font-bold">Latency</p>
                </div>
            </div>

            <div id="jp-node-container" class="bg-[#161616] border border-white/5 p-6 rounded-xl flex items-center justify-between shadow-lg transition-all duration-500">
                <div class="flex items-center gap-4">
                    <div class="status-dot online"></div>
                    <div>
                        <h3 class="font-bold flex items-center" id="jp-node">東京節點 (Japan - 01)</h3>
                        <p class="text-xs text-gray-500">備用備援與跨區加速</p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="jp-latency" class="text-indigo-400 font-mono text-sm">-- ms</span>
                    <p class="text-[10px] text-gray-600 uppercase tracking-tighter font-bold">Latency</p>
                </div>
            </div>
        </div>
    </div>

    <script>
    // 1. 自動更換位置標籤與推薦邏輯
    async function detectLocation() {
        const locationElement = document.getElementById('user-region');
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            if (data.country_name) {
                locationElement.classList.remove('pulse');
                locationElement.innerText = `● 已定位區域：${data.country_name} (${data.city}) | 系統已分配最佳路由`;
                if (data.country_code === 'TW') markBestNode('tc-node', 'tc-node-container');
                else if (data.country_code === 'JP') markBestNode('jp-node', 'jp-node-container');
            }
        } catch (e) {
            locationElement.innerText = '● 區域連線：Taichung - 01 | 預設路由模式';
            locationElement.classList.remove('pulse');
        }
    }

    function markBestNode(nodeId, containerId) {
        const nodeTitle = document.getElementById(nodeId);
        const container = document.getElementById(containerId);
        if(!nodeTitle.querySelector('.best-badge')) {
            const badge = document.createElement('span');
            badge.className = 'best-badge ml-3 text-[10px] bg-green-500/20 text-green-400 px-2 py-0.5 rounded border border-green-500/30';
            badge.innerText = '最適合您';
            nodeTitle.appendChild(badge);
            container.classList.add('border-indigo-500/50', 'bg-indigo-500/[0.03]');
        }
    }

    // 2. 核心：自動更新延遲數值
    function updateLatencies() {
        // 台中節點模擬 (8-15ms 之間跳動)
        const tcLat = Math.floor(Math.random() * (15 - 8 + 1)) + 8;
        document.getElementById('tc-latency').innerText = `${tcLat}ms`;

        // 東京節點模擬 (40-55ms 之間跳動)
        const jpLat = Math.floor(Math.random() * (55 - 40 + 1)) + 40;
        document.getElementById('jp-latency').innerText = `${jpLat}ms`;
    }

    // 每 2 秒更新一次數據
    setInterval(updateLatencies, 2000);
    
    window.onload = () => {
        detectLocation();
        updateLatencies(); // 初始載入先執行一次
    };
    </script>
</body>
</html>
