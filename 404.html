<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | 你迷失了...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 定義柔和莫蘭迪色調 */
            --bg-soft: #f7f9fc; /* 米白/淡藍灰，與主頁一致 */
            --text-main: #57606f; /* 柔和深灰 */
            --text-sub: #aab0b6; /* 淡灰 */
            --primary-pastel: #a29bfe; /* 柔和紫 */
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-soft);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        /* 延用主頁的柔和 GIF 背景 */
        .video-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2;
            object-fit: cover;
            /* 這裡使用一個線上的淡雅雲霧 GIF 作為範例，你可以換成你自己的 GIF 連結 */
            background-image: url('/images/sakiko-err.gif');
            background-size: cover;
            background-position: center;
            opacity: 0.5; /* 讓 GIF 隱約浮現，不搶戲 */
        }

        /* 柔和的 404 主標題 (改為漸層紫) */
        .soft-title {
            font-size: clamp(7rem, 20vw, 11rem);
            font-weight: 900;
            letter-spacing: -0.05em;
            background: linear-gradient(135deg, #a29bfe 0%, #ff9ff3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 加入淡淡的紫色光暈 */
            filter: drop-shadow(0 10px 25px rgba(162, 155, 254, 0.3));
            margin-bottom: -1rem;
        }

        /* 超級大圓角柔和卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px); /* 玻璃模糊 */
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 40px; /* 超大圓角 */
            box-shadow: 0 20px 50px rgba(162, 155, 254, 0.1); /* 淡淡的紫色陰影 */
        }

        /* 柔和漸層按鈕 */
        .btn-pastel {
            background: linear-gradient(135deg, #a29bfe 0%, #d630311a 100%);
            background-color: var(--primary-pastel);
            color: white;
            transition: 0.4s;
            box-shadow: 0 8px 20px rgba(162, 155, 254, 0.3);
        }

        .btn-pastel:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(162, 155, 254, 0.4);
        }

        /* 頁尾文字 */
        .footer-text {
            color: var(--text-sub);
            font-size: 11px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="p-6">

    <div class="video-bg"></div>

    <div class="relative z-10 text-center">
        <h1 class="soft-title italic">迷失了</h1>
        
        <div class="glass-card p-12 lg:p-16 max-w-2xl mx-auto mt-4">
            <h2 class="text-2xl font-bold tracking-tight mb-4 text-[#2d3436]">
                糟糕！你迷失了...
            </h2>
            <p class="text-[var(--text-main)] text-sm leading-relaxed tracking-wider mb-10">
                抱歉，但你可能因為聽了迷星叫而迷失了。<br>
                您可以試試看去聽Ave Mujica的音樂 或者 回去首頁、商店。
            </p>
            
            <div class="flex flex-col sm:flex-row gap-5 justify-center">
                <a href="index.html" class="btn-pastel font-bold py-4 px-12 rounded-full text-xs tracking-widest uppercase">
                    回到主頁 / Home
                </a>
                <a href="store.html" class="btn-pastel font-bold py-4 px-12 rounded-full text-xs tracking-widest uppercase">
                    前往商店 / Store
                </a>
            </div>
        </div>

        <div class="mt-16 footer-text">
            OHW Network · Soft Navigation System
        </div>
    </div>

</body>
</html>
