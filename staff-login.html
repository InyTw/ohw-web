<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/images/favicon.png" type="image/x-icon">
    <title>工作人員登入 | Staff Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/staff-login.css">
    <script src="/scripts/staff-login.js" defer></script>
</head>
<body>

    <header>
        <div class="brand-logo">ohw Network</div>
        <nav>
            <a href="index.html">首頁入口</a>
            <a href="news.html">公告資訊</a>
            <a href="staff-list.html">管理團隊</a>
            <a href="apply.html">加入招募</a>
        </nav>
    </header>

    <div class="auth-container">
        <div class="terminal-box">
            <h2>工作人員登入</h2>
            <div class="alert-status">⚠️ <span>RESTRICTED AREA</span> / 內部授權分區</div>
            
            <div class="error-message-box" id="error-box"></div>

            <form id="login-form">
                <div class="field-block">
                    <label>電子信箱</label>
                    <input type="email" id="email" required placeholder="admin@gmail.com">
                </div>
                <div class="field-block">
                    <label>密碼</label>
                    <input type="password" id="password" required placeholder="•••••••••••••">
                </div>
                <button type="submit" class="action-btn">登入</button>
            </form>
            
            <div class="sys-log">忘記密碼? || 關我闢室，去找服主 :/</div>
        </div>
    </div>
</body>
</html>
